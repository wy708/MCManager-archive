limit_req_zone $binary_remote_addr zone=admin_login:1m rate=12r/m;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin http://backend:8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    location = /api/auth/login {
        client_max_body_size 8k;
        limit_req zone=admin_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass $backend_origin;
    }
    location ~ ^/api/(backups/[0-9a-f-]+|host/v1/(jobs|restores)/[0-9a-f-]+)/content$ {
        client_max_body_size 16g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_pass $backend_origin;
    }
    location ~ ^/api/world-maps/[0-9a-f-]+/view/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'; object-src 'none'" always;
        proxy_pass $backend_origin;
    }
    location /api/ {
        client_max_body_size 1m;
        proxy_pass $backend_origin;
    }
    location / { try_files $uri $uri/ /index.html; }
}
