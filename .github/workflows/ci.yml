name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --prefix backup --ignore-scripts
      - run: sh mvnw -B -ntp test
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test frontend/test/*.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      - run: node --test integrations/dsh/game-ai.test.mjs
      - run: python3 scripts/check-public.py
      - run: python3 scripts/test_configure.py
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: backup
      - run: npm test
        working-directory: backup
